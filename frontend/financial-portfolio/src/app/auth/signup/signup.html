<div class="signup-page">
  <div class="signup-card col-12 col-md-6">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="signup-form">
      <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" id="email" class="form-control" formControlName="email"/>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-control" formControlName="password"/>
      </div>
      <div class="mb-3">
        <label for="role-select" class="form-label">Role</label>
        <select name="role" id="role-select" class="form-select" formControlName="role">
          <option value="Basic">Basic</option>
          <option value="Pro">Pro</option>
          <option value="Administrator">Administrator</option>
        </select>
      </div>  
      <div class="d-flex gap-2 flex-wrap">
        <button class="btn btn-primary" type="submit">Sign up</button>
      </div>
      @if (errorMessage()) {
        <p class="request-error">{{ errorMessage() }}</p>
      }
    </form>
  </div>
</div>
